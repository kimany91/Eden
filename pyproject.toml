[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eden"
dynamic = ["version"]
description = "Assistant de mixage automatique de voix rap pour projets FL Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "scipy>=1.11",
  "packaging>=23",
]

[project.optional-dependencies]
gui = [
  "PySide6-Essentials>=6.6", "PySide6-Addons>=6.6",  # Addons: Qt Quick 3D (the garden), Qt Multimedia (listening)
  # PySide6 6.12.0 drops a reference to True at each signal emitted: before Python 3.12 (where True can be
  # freed) Eden aborts after a few thousand signals ("bool_dealloc"); from 3.12 on True is immortal
  "PySide6-Essentials!=6.12.0; python_version < '3.12'", "PySide6-Addons!=6.12.0; python_version < '3.12'",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
eden = "eden.cli:main"

[tool.setuptools.dynamic]
version = { attr = "eden.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eden = ["assets/*", "gui/qml/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP"]
